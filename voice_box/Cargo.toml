[package]
name = "voice_box"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
atomic-write-file.workspace = true
dfn3_rs.workspace = true
eframe = { workspace = true, features = [
    "accesskit",
    "clipboard",
    "glow",
    "links",
    "persistence",
] }
egui = { workspace = true, features = ["serde"] }
egui-winit.workspace = true
lz4_flex.workspace = true
num_enum.workspace = true
restart-manager.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
symphonia = { workspace = true, features = [
    "mp3",
    "id3v2",
    "wav",
    "pcm",
    "flac",
    "ogg",
    "vorbis",
] }
tracing.workspace = true
tracing-subscriber.workspace = true
voice_box_shared.workspace = true
wasapi.workspace = true
windows = { workspace = true, features = [
    "Devices_Enumeration",
    "Foundation",
    "Media_Audio",
    "Media_Capture",
    "Media_Devices",
    "Media_MediaProperties",
    "Media_Render",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_DirectWrite",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_TaskScheduler",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Shell_Common",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-collections.workspace = true
windows-core.workspace = true
winreg = { workspace = true, features = ["transactions"] }

[build-dependencies]
find-msvc-tools.workspace = true
image = { workspace = true, features = ["ico"] }
lz4_flex.workspace = true
resvg.workspace = true
