[package]
name = "aec3"
version = "0.4.0"
edition = "2024"
authors = ["Angelos-Ermis Mangos"]
description = "VoiceBox's reduced WebRTC AEC3 DSP dependency"
license = "MIT OR BSD-3-Clause"
repository = "https://github.com/RubyBit/aec3-rs"

[features]
diagnostics = ["dep:postcard", "dep:serde", "dep:hound"]

[dependencies]
log = "0.4"
num-complex = "0.4.6"
rustfft = "6.4.1"
hound = { version = "3", optional = true }
postcard = { version = "1.1.3", features = ["alloc"], optional = true, default-features = false }
serde = { version = "1.0.219", features = ["derive"], optional = true }
