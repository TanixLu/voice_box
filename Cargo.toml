[package]
name = "voice_box"
version = "0.1.0"
edition = "2024"
default-run = "voice_box"

[lib]
crate-type = ["cdylib"]

[profile.release]
panic = "abort"

[dependencies]
anyhow = "1.0.104"
constcat = "0.6.1"
is_elevated = "0.1.2"
restart-manager = "0.1.0"
runas = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
single-instance = "0.3.3"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
wasapi = "0.24.0"
winreg = "0.56.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Apo",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.62.2"
