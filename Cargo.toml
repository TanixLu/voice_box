[workspace]
members = ["voice_box", "voice_box_apo", "voice_box_shared"]
default-members = ["voice_box"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
lz4_flex = { version = "0.14.0", default-features = false, features = [
    "std",
    "safe-encode",
    "safe-decode",
    "checked-decode",
] }
num_enum = "0.7.6"
strum = { version = "0.28", default-features = false, features = ["derive"] }
voice_box_shared = { path = "voice_box_shared" }
windows = "0.62.2"
windows-core = "0.62.2"

[profile.dev]
opt-level = 3
lto = "thin"
panic = "unwind"
debug = false
debug-assertions = false
overflow-checks = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
strip = true
incremental = false
