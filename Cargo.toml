[package]
name = "voice_box"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
default-run = "voice_box"

[lib]
crate-type = ["cdylib"]

[profile.release]
panic = "abort"

[dependencies]
egui = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "links",
    "persistence",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.104"
atomic-write-file = "0.3.1"
realfft = "3.5"
rustfft = "6.4"
pulp = "0.22"
rubato = { version = "5.0", default-features = false }
restart-manager = "0.1.0"
single-instance = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
wasapi = "0.24.0"
winreg = { version = "0.56.0", features = ["transactions"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Apo",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

[build-dependencies]
find-msvc-tools = "0.1"
image = { version = "0.25", default-features = false, features = ["ico"] }
resvg = { version = "0.47", default-features = false }
