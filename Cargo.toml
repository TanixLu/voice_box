[package]
name = "voice_box"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
panic = "abort"

[dependencies]
anyhow = "1.0.104"
constcat = "0.6.1"
is_elevated = "0.1.2"
restart-manager = "0.1.0"
runas = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
wasapi = "0.24.0"
winreg = "0.56.0"
