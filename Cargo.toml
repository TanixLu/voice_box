[package]
name = "voice_box"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
default-run = "voice_box"

[lib]
name = "voice_box_apo"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
atomic-write-file = "0.3.1"
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "links",
    "persistence",
] }
egui = { version = "0.37", default-features = false }
lz4_flex = { version = "0.13.1", default-features = false, features = [
    "std",
    "safe-encode",
    "safe-decode",
    "checked-decode",
] }
restart-manager = "0.1.0"
rubato = { version = "5.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
single-instance = "0.3.3"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3",
    "wav",
    "pcm",
    "flac",
    "ogg",
    "vorbis",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
ul_unas_rs = "0.1.1"
wasapi = "0.26.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Apo",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Shell_Common",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"
winreg = { version = "0.56.0", features = ["transactions"] }

[build-dependencies]
find-msvc-tools = "0.1"
image = { version = "0.25", default-features = false, features = ["ico"] }
lz4_flex = { version = "0.13.1", default-features = false, features = [
    "std",
    "safe-encode",
    "safe-decode",
    "checked-decode",
] }
resvg = { version = "0.48.1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
