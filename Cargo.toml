[workspace]
members = ["crates/app", "crates/apo", "crates/shared"]
default-members = ["crates/app"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
lz4_flex = { version = "0.14.0", default-features = false, features = [
    "std",
    "safe-encode",
    "safe-decode",
    "checked-decode",
] }
voice_box_shared = { path = "crates/shared" }
windows = "0.62.2"
windows-core = "0.62.2"

[profile.dev]
opt-level = 3
lto = "thin"
panic = "unwind"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
incremental = false
