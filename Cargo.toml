[workspace]
members = ["voice_box", "voice_box_apo", "voice_box_shared"]
default-members = ["voice_box"]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
atomic-write-file = "0.3.1"
dfn3_rs = { version = "0.1.2", default-features = false }
eframe = { version = "0.37.0", default-features = false }
egui = { version = "0.37.0", default-features = false }
egui-winit = { version = "0.37.0", default-features = false }
find-msvc-tools = "0.1.15"
image = { version = "0.25.10", default-features = false }
lz4_flex = { version = "0.14.2", default-features = false, features = [
    "std",
    "safe-encode",
    "safe-decode",
    "checked-decode",
] }
num_enum = "0.7.6"
restart-manager = "0.1.0"
resvg = { version = "0.50.0", default-features = false }
rubato = { version = "5.1.0", default-features = false }
rusqlite = "0.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
symphonia = { version = "0.6.1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
voice_box_shared = { path = "voice_box_shared" }
wasapi = "0.27.0"
windows = "0.62.2"
windows-collections = "0.3.2"
windows-core = "0.62.2"
winreg = "0.56.0"

[profile.dev]
opt-level = 3
lto = "thin"
panic = "unwind"
debug = false
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
debug-assertions = false
overflow-checks = false
incremental = false
